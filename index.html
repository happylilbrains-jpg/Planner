<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johnny's Homeschool Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#FFF7E6;
  --bg-paper:#FFFDF7;
  --surface:#FFFFFF;
  --ink:#2A2335;
  --muted:#6E6580;
  --line:rgba(42,35,53,0.10);
  --line-hi:rgba(42,35,53,0.22);
  --shadow:0 2px 0 rgba(42,35,53,0.06), 0 6px 24px rgba(42,35,53,0.08);
  --shadow-lift:0 4px 0 rgba(42,35,53,0.08), 0 12px 32px rgba(42,35,53,0.12);
  --radius:18px;
  --radius-sm:12px;
  --radius-pill:999px;

  --c-red:#E63946;        --c-red-soft:#FFE2E5;
  --c-orange:#F4A261;     --c-orange-soft:#FFEDD8;
  --c-yellow:#F9C74F;     --c-yellow-soft:#FFF5D1;
  --c-green:#43AA8B;      --c-green-soft:#D9F2E8;
  --c-blue:#4A90E2;       --c-blue-soft:#DCEAFB;
  --c-purple:#9B5DE5;     --c-purple-soft:#EDDFFB;
  --c-pink:#FF6B9D;       --c-pink-soft:#FFD8E5;
  --c-teal:#48BFE3;       --c-teal-soft:#D6F0F9;
}
html,body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 8%, var(--c-yellow-soft) 0, transparent 28%),
    radial-gradient(circle at 88% 6%, var(--c-pink-soft) 0, transparent 26%),
    radial-gradient(circle at 90% 92%, var(--c-teal-soft) 0, transparent 30%),
    radial-gradient(circle at 8% 88%, var(--c-purple-soft) 0, transparent 30%);
  color:var(--ink);
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:600;
  line-height:1.55;
  min-height:100vh;
}
.app{max-width:680px;margin:0 auto;padding:12px 12px 28px;position:relative;}

/* ---------- HEADER ---------- */
header.top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:12px;flex-wrap:wrap;
}
.header-left{display:flex;align-items:center;gap:10px;}
.header-mascot{flex-shrink:0;width:46px;height:46px;}
header.top h1{
  font-family:'Fredoka',sans-serif;
  font-weight:700;font-size:22px;letter-spacing:-0.02em;
  background:linear-gradient(90deg,var(--c-red),var(--c-orange),var(--c-yellow),var(--c-green),var(--c-blue),var(--c-purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1.1;
}
header.top .sub{color:var(--muted);font-size:12px;margin-top:1px;font-weight:600;}
header.top nav{display:flex;gap:6px;flex-wrap:wrap;}
header.top nav button{
  background:var(--surface);border:2px solid var(--line);color:var(--ink);
  padding:7px 13px;border-radius:var(--radius-pill);
  font-family:'Fredoka',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;transition:all 0.15s ease;
}
header.top nav button:hover{transform:translateY(-1px);border-color:var(--c-purple);}
header.top nav button.active{
  background:var(--c-purple);color:#fff;border-color:var(--c-purple);
  box-shadow:0 3px 0 #6c3fb8;
}

/* ---------- PANEL ---------- */
.panel{
  background:var(--surface);
  border:2px solid var(--line);
  border-radius:var(--radius);
  padding:14px 15px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
  position:relative;
}
.panel h2{
  font-family:'Fredoka',sans-serif;
  font-size:17px;font-weight:600;margin-bottom:11px;
  display:flex;align-items:center;gap:7px;
}
.panel h3{
  font-family:'Fredoka',sans-serif;
  font-size:14px;font-weight:600;margin:12px 0 7px;
  color:var(--c-purple);
  display:flex;align-items:center;gap:6px;
}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
label.field{
  display:flex;flex-direction:column;gap:5px;
  font-family:'Fredoka',sans-serif;font-size:11px;
  color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:500;
}
select,input[type=text],input[type=date],input[type=url]{
  background:var(--bg-paper);
  border:2px solid var(--line);
  border-radius:var(--radius-sm);
  padding:9px 12px;
  font-size:14px;color:var(--ink);
  font-family:inherit;font-weight:600;
}
select:focus,input:focus{outline:3px solid var(--c-yellow);outline-offset:1px;border-color:var(--c-orange);}

/* ---------- BUTTONS ---------- */
button.primary{
  background:var(--c-red);color:#fff;border:none;
  border-radius:var(--radius-pill);
  padding:11px 18px;
  font-family:'Fredoka',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;
  box-shadow:0 4px 0 #b8202c;
  transition:all 0.1s ease;
}
button.primary:hover{transform:translateY(-1px);box-shadow:0 5px 0 #b8202c;}
button.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #b8202c;}
button.secondary{
  background:var(--c-yellow);color:#5a3e00;border:none;
  border-radius:var(--radius-pill);
  padding:11px 16px;
  font-family:'Fredoka',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;box-shadow:0 3px 0 #c8970d;
  transition:all 0.1s ease;
}
button.secondary:hover{transform:translateY(-1px);box-shadow:0 4px 0 #c8970d;}
button.secondary:active{transform:translateY(2px);box-shadow:0 1px 0 #c8970d;}
button.ghost{
  background:transparent;color:var(--muted);
  border:2px dashed var(--line-hi);border-radius:var(--radius-pill);
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:'Fredoka',sans-serif;
}
button.ghost:hover{color:var(--ink);border-color:var(--c-purple);}

/* ---------- PILLS ---------- */
.pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 11px;border-radius:var(--radius-pill);
  font-family:'Fredoka',sans-serif;
  font-size:12px;font-weight:500;letter-spacing:0.02em;
}
.pill.red    {background:var(--c-red-soft);    color:#9c1f29;}
.pill.orange {background:var(--c-orange-soft); color:#7a4612;}
.pill.yellow {background:var(--c-yellow-soft); color:#7a5a00;}
.pill.green  {background:var(--c-green-soft);  color:#1f6850;}
.pill.blue   {background:var(--c-blue-soft);   color:#1e4f87;}
.pill.purple {background:var(--c-purple-soft); color:#5e2da8;}
.pill.pink   {background:var(--c-pink-soft);   color:#a83464;}
.pill.teal   {background:var(--c-teal-soft);   color:#1c6781;}
.pill.muted  {background:var(--bg-paper); color:var(--muted); border:1px solid var(--line);}

/* ---------- WEEKEND BANNER ---------- */
.weekend-banner{
  background:linear-gradient(135deg,var(--c-yellow-soft),var(--c-pink-soft));
  color:#5a3e00;border:2px solid var(--c-orange);
  padding:14px 16px;border-radius:var(--radius);font-size:14px;font-weight:600;
  font-family:'Fredoka',sans-serif;
}

/* ---------- PLAN ---------- */
.plan h2.theme{
  font-family:'Fredoka',sans-serif;
  font-size:21px;font-weight:700;letter-spacing:-0.02em;
  margin-bottom:4px;line-height:1.15;
  color:var(--ink);
}
.plan .date-line{
  color:var(--muted);font-size:12px;margin-bottom:11px;font-weight:600;
}
.plan .meta{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));
  gap:7px 10px;margin-bottom:4px;
  background:var(--bg-paper);border-radius:var(--radius-sm);
  padding:10px 12px;border:1px solid var(--line);
}
.plan .meta .meta-label{
  color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;
  font-family:'Fredoka',sans-serif;font-size:9.5px;font-weight:500;
}
.plan .meta .meta-value{
  color:var(--ink);font-size:13px;font-weight:700;margin-top:1px;line-height:1.25;
}

.plan .goal{
  background:linear-gradient(135deg,var(--c-yellow-soft),var(--c-orange-soft));
  color:#5a3e00;
  border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;
  margin:10px 0;border-left:5px solid var(--c-yellow);
}
.plan .goal strong{font-family:'Fredoka',sans-serif;font-weight:600;}

.plan .read-aloud{
  background:var(--c-blue-soft);
  border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;
  margin:10px 0;border-left:5px solid var(--c-blue);
}
.plan .read-aloud strong{color:#1e4f87;font-family:'Fredoka',sans-serif;font-weight:600;}
.plan .read-aloud ul{margin:6px 0 0 20px;}
.plan .read-aloud li{margin-bottom:2px;}

/* ---------- ACTIVITY LIST (flat) ---------- */
.activities-section{margin-top:10px;}
.activities-list{display:flex;flex-direction:column;gap:9px;}

.activity-card{
  position:relative;
  background:var(--surface);
  border:2px solid var(--line);
  border-left:5px solid var(--card-color, var(--c-purple));
  border-radius:var(--radius-sm);
  padding:10px 12px;
  box-shadow:0 2px 0 rgba(42,35,53,0.04);
}
.activity-card .activity-num{
  flex-shrink:0;
  width:21px;height:21px;border-radius:50%;
  background:var(--card-color, var(--c-purple));color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:12px;
}
.activity-card .activity-head{
  display:flex;align-items:center;
  gap:8px;margin-bottom:5px;
}
.activity-card .activity-title{
  font-family:'Fredoka',sans-serif;
  font-size:15px;font-weight:600;color:var(--ink);
  flex:1;min-width:0;line-height:1.25;
}
.activity-card .focus-pill{
  font-family:'Fredoka',sans-serif;
  font-size:11px;font-weight:600;
  padding:4px 10px;border-radius:var(--radius-pill);
  background:var(--card-color, var(--c-purple));color:#fff;
  flex-shrink:0;
}
.activity-card .activity-meta{
  display:flex;gap:5px;flex-wrap:wrap;
  font-size:10.5px;color:var(--muted);margin-bottom:7px;
}
.activity-card .activity-steps{
  font-size:13px;color:var(--ink);margin-left:18px;font-weight:600;line-height:1.4;
}
.activity-card .activity-steps li{margin-bottom:2px;}
.activity-card .activity-mat{
  font-size:12px;color:var(--muted);margin-top:7px;font-weight:600;
}
.activity-card .activity-safety{
  font-size:12px;color:#9c1f29;margin-top:5px;
  background:var(--c-red-soft);
  padding:6px 10px;border-radius:var(--radius-sm);font-weight:600;
}

/* ---------- MATERIALS ---------- */
.materials-list{display:flex;flex-wrap:wrap;gap:6px;}
.materials-list .pill{
  background:var(--bg-paper);border:1px solid var(--line);
  color:var(--ink);font-size:12px;font-weight:600;padding:4px 10px;
  font-family:'Nunito',sans-serif;
}

/* ---------- SPANISH ---------- */
.spanish-list{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
  gap:5px 12px;font-size:13px;
  background:var(--c-pink-soft);
  padding:10px 13px;border-radius:var(--radius-sm);
  border-left:5px solid var(--c-pink);
}
.spanish-list .es{color:#a83464;font-weight:700;font-family:'Fredoka',sans-serif;}
.spanish-list .en{color:var(--muted);}

/* ---------- MILESTONE ---------- */
.milestone{
  background:var(--c-green-soft);
  border-radius:var(--radius-sm);padding:10px 13px;font-size:12.5px;
  margin:10px 0;color:#1f6850;border-left:5px solid var(--c-green);
}
.milestone strong{font-family:'Fredoka',sans-serif;font-weight:600;}

/* ---------- FEEDBACK ---------- */
.feedback{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.feedback button{
  background:#fff;border:2px solid var(--line-hi);
  border-radius:var(--radius-pill);padding:7px 12px;
  font-family:'Fredoka',sans-serif;font-size:12px;font-weight:500;
  cursor:pointer;transition:all 0.1s ease;
}
.feedback button:hover{transform:translateY(-1px);}
.feedback button.selected{
  background:var(--c-green);color:#fff;border-color:var(--c-green);
  box-shadow:0 2px 0 #2e7d62;
}

/* ---------- TOMORROW ---------- */
.tomorrow{
  font-size:12.5px;color:var(--ink);
  background:linear-gradient(135deg,var(--c-purple-soft),var(--c-teal-soft));
  border-radius:var(--radius-sm);padding:10px 13px;margin-top:10px;
  border-left:5px solid var(--c-purple);font-weight:600;
}
.tomorrow strong{font-family:'Fredoka',sans-serif;color:#5e2da8;}

/* ---------- HISTORY ---------- */
.history-row{
  display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:8px;
  padding:10px 0;border-top:1px solid var(--line);font-size:13px;
}
.history-row:first-child{border-top:none;}
.history-row .h-date{color:var(--muted);font-weight:600;}
.history-row .h-fb{color:var(--c-green);font-size:12px;font-weight:600;}

.footer-help{
  font-family:'Fredoka',sans-serif;
  font-size:12px;color:var(--muted);text-align:center;margin-top:16px;font-weight:500;
  display:flex;justify-content:center;align-items:center;gap:8px;
}
.dino-strip{display:flex;justify-content:center;gap:10px;margin:18px 0 6px;opacity:0.6;}

/* ---------- RESPONSIVE ---------- */
@media (max-width:560px){
  .app{padding:10px 10px 24px;}
  header.top{gap:8px;}
  header.top h1{font-size:20px;}
  header.top nav{width:100%;}
  header.top nav button{flex:1;text-align:center;}
  .row{flex-direction:column;align-items:stretch;}
  .row > *{width:100%;}
  .plan h2.theme{font-size:19px;}
  .plan .meta{grid-template-columns:1fr 1fr;}
}
@media (max-width:360px){
  .plan .meta{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
/* ============================================================
   Johnny's Homeschool Planner — single-file build.
   Open this HTML in any modern browser. State persists per
   browser via localStorage; no server, no internet required.
   ============================================================ */
window.HSP = window.HSP || {};

/* ---------- data: johnny ---------- */
window.HSP.JOHNNY = {
  name: "Johnny",
  birthday: "2024-06-14",
  ageMonthsAt: function (date) {
    const b = new Date(this.birthday);
    const d = new Date(date);
    return (d.getFullYear() - b.getFullYear()) * 12
      + (d.getMonth() - b.getMonth())
      - (d.getDate() < b.getDate() ? 1 : 0);
  }
};

/* ---------- data: curriculum ---------- */
window.HSP.CURRICULUM = {
  startAnchor: { date: "2026-05-04", unit: 6, week: 2, day: 1 },
  dayOfWeekSkills: {
    1: { label: "Predicting & Sorting",       primary: "predicting",     secondary: "sorting" },
    2: { label: "Letter Naming & Numbers",    primary: "alphabet",       secondary: "numbers" },
    3: { label: "Predicting & Measuring",     primary: "predicting",     secondary: "measuring" },
    4: { label: "Letter Naming & Numbers",    primary: "alphabet",       secondary: "numbers" },
    5: { label: "Recall & Retell, Shapes",    primary: "recall_retell",  secondary: "shapes" }
  },
  units: [
    { n: 1,  name: "Apples",                   letters: ["Aa"] },
    { n: 2,  name: "Colors",                   letters: ["Rr"] },
    { n: 3,  name: "Nursery Rhymes",           letters: ["Nn"] },
    { n: 4,  name: "Clothing",                 letters: ["Cc", "Jj"] },
    { n: 5,  name: "Food",                     letters: ["Mm"] },
    { n: 6,  name: "Five Senses",              letters: ["Ss"] },
    { n: 7,  name: "Teddy Bears",              letters: ["Bb"] },
    { n: 8,  name: "Things That Go Together",  letters: ["Qq", "Uu"] },
    { n: 9,  name: "Community Helpers",        letters: ["Hh"] },
    { n: 10, name: "Transportation",           letters: ["Tt"] },
    { n: 11, name: "On the Farm",              letters: ["Kk"] },
    { n: 12, name: "Weather",                  letters: ["Ff"] },
    { n: 13, name: "Eggs",                     letters: ["Ww", "Ee"] },
    { n: 14, name: "Plants",                   letters: ["Pp", "Ll"] },
    { n: 15, name: "Construction",             letters: ["Yy", "Zz"] },
    { n: 16, name: "Pets",                     letters: ["Dd"] },
    { n: 17, name: "Opposites",                letters: ["Oo", "Xx"] },
    { n: 18, name: "Fairy Tales & Folk Tales", letters: ["Gg", "Vv"] },
    { n: 19, name: "Water",                    letters: ["Ii"] }
  ],
  /* Day theme names describe the day's FOCUS (sense, skill, letter). They do
     NOT promise specific curriculum activities — the planner adapts the
     curriculum's framework to toddler-friendly activities from its own bank. */
  daySubThemes: {
    "6-1-1": { theme: "Five senses — let's start" },
    "6-1-2": { theme: "Letter Ss — meet the new letter" },
    "6-1-3": { theme: "Senses every day" },
    "6-1-4": { theme: "Letter Ss — practice + numbers" },
    "6-1-5": { theme: "Sight day + shapes",                senseFocus: "sight" },
    "6-2-1": { theme: "Hearing day — listen and notice",   senseFocus: "hearing" },
    "6-2-2": { theme: "Letter Ss + I-spy numbers",         senseFocus: "sight" },
    "6-2-3": { theme: "Smell day — sniff and name",        senseFocus: "smell" },
    "6-2-4": { theme: "Touch day — feel and describe",     senseFocus: "touch" },
    "6-2-5": { theme: "Recap the five senses + shapes" },
    "7-1-1": { theme: "Teddy bears — meet our friends" },
    "7-1-2": { theme: "Letter Bb + counting bears" },
    "7-1-3": { theme: "Bear sizes — big & small" },
    "7-1-4": { theme: "Letter Bb + bear numbers" },
    "7-1-5": { theme: "Bear stories — recall + shapes" },
    "7-2-1": { theme: "Bears — sorting day" },
    "7-2-2": { theme: "Letter Bb — review" },
    "7-2-3": { theme: "Bear measurements" },
    "7-2-4": { theme: "Letter Bb — bear count" },
    "7-2-5": { theme: "Teddy bear picnic — recall" }
  },
  unitGuidingQuestion: {
    6: "What are our five senses, and how do we use them?",
    7: "What is a teddy bear, and how can teddy bears help us learn?"
  },
  /* Activity tags each unit's play should lean toward. Drives activity
     selection so the plan reflects the CURRENT unit, not a past one.
     Sense tags (smell/taste/etc.) only belong to the units that list them,
     so they don't leak forward into later units like "Things That Go Together". */
  unitFocusTags: {
    1:  ["sorting","colors","taste"],
    2:  ["colors","sorting","sight"],
    3:  ["language","music","pretend","read_aloud"],
    4:  ["sorting","matching","household"],
    5:  ["taste","sorting","household"],
    6:  ["smell","taste","touch","hearing","sight"],
    7:  ["pretend","sorting","measuring"],
    8:  ["matching","sorting"],
    9:  ["pretend","language","follow_directions"],
    10: ["movement","pretend","sound"],
    11: ["pretend","sound","language"],
    12: ["sight","language","outdoor"],
    13: ["sorting","fine_motor"],
    14: ["outdoor","sensory","exploration"],
    15: ["fine_motor","problem_solving","numbers"],
    16: ["pretend","language","sound"],
    17: ["sorting","matching","vocabulary"],
    18: ["language","pretend","read_aloud"],
    19: ["sensory","touch","measuring"]
  },
  locationForDate: function (date, dateUtils) {
    const anchor = this.startAnchor;
    const offset = dateUtils.weekdaysBetween(anchor.date, date);
    const anchorIndex = (anchor.unit - 1) * 10 + (anchor.week - 1) * 5 + (anchor.day - 1);
    const totalIndex = anchorIndex + offset;
    if (totalIndex < 0) return null;
    const unitNum = Math.floor(totalIndex / 10) + 1;
    const week = Math.floor((totalIndex % 10) / 5) + 1;
    const day = (totalIndex % 5) + 1;
    if (unitNum > this.units.length) return { unit: null, week, day, beyondCurriculum: true };
    const unit = this.units[unitNum - 1];
    const key = unit.n + "-" + week + "-" + day;
    const sub = this.daySubThemes[key] || null;
    return { unit, week, day, sub, key };
  }
};

/* ---------- data: caregivers ---------- */
window.HSP.CAREGIVERS = {
  mama:           { id: "mama",            label: "Mama",              mode: "full"     },
  dada:           { id: "dada",            label: "Dada",              mode: "full"     },
  mama_dada:      { id: "mama_dada",       label: "Mama & Dada",       mode: "full"     },
  nana:           { id: "nana",            label: "Nana",              mode: "spanish"  },
  papa:           { id: "papa",            label: "Papa",              mode: "spanish"  },
  nana_papa:      { id: "nana_papa",       label: "Nana & Papa",       mode: "spanish"  },
  grandma:        { id: "grandma",         label: "Grandma",           mode: "low_prep" },
  grandpa:        { id: "grandpa",         label: "Grandpa",           mode: "low_prep" },
  grandma_grandpa:{ id: "grandma_grandpa", label: "Grandma & Grandpa", mode: "low_prep" }
};
window.HSP.CAREGIVER_MODES = {
  full: {
    id: "full", label: "Full plan",
    activitiesCount: 6,
    allowMessy: true,
    spanishExposure: "light",
    includeReadAloud: true, adultInvolvement: "high"
  },
  spanish: {
    id: "spanish", label: "Conversational + Spanish exposure",
    activitiesCount: 4,
    allowMessy: false,
    spanishExposure: "rich",
    includeReadAloud: true, adultInvolvement: "medium"
  },
  low_prep: {
    id: "low_prep", label: "Low-prep + find-it games",

  setForDay: function (unitName, dayThemeKeyword, take) {
    const buckets = [this.general_action, this.general_courtesy];
    const u = (unitName || "").toLowerCase();
    if (u.includes("five senses")) buckets.push(this.five_senses);
    if (u.includes("teddy")) buckets.push(this.teddy_bears);
    if (u.includes("food")) buckets.push(this.food);
    if (u.includes("colors")) buckets.push(this.colors);
    if ((dayThemeKeyword || "").toLowerCase().includes("number")) buckets.push(this.numbers_1_10);
    buckets.push(this.general_body);
    const flat = [].concat.apply([], buckets);
    const seen = {};
    const dedup = flat.filter(w => (seen[w.en] ? false : (seen[w.en] = true)));
    return dedup.slice(0, take || 6);
  }

window.HSP.ACTIVITIES_QUERY = function (opts) {
  const recent = opts.recentIds || [];
  return window.HSP.ACTIVITIES.filter(a => {
    if (recent.indexOf(a.id) !== -1) return false;
    if (opts.kind && a.kind !== opts.kind) return false;
    if (opts.tag && a.tags.indexOf(opts.tag) === -1) return false;
    if (opts.tags && !opts.tags.every(t => a.tags.indexOf(t) !== -1)) return false;
    if (opts.anyTag && !opts.anyTag.some(t => a.tags.indexOf(t) !== -1)) return false;
    if (opts.excludeTags && opts.excludeTags.some(t => a.tags.indexOf(t) !== -1)) return false;
    if (opts.mode && a.modes.indexOf(opts.mode) === -1) return false;
    if (opts.maxMess) {
      const order = { none: 0, low: 1, medium: 2, high: 3 };
      if (order[a.mess] > order[opts.maxMess]) return false;
    }
    if (opts.maxPrep) {
      const order = { none: 0, low: 1, medium: 2, high: 3 };
      if (order[a.prep] > order[opts.maxPrep]) return false;
    }
    return true;
  });
};

/* ---------- lib: dateUtils ---------- */
window.HSP.dateUtils = (function () {
  const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  function parseISO(s) {
    if (s instanceof Date) return new Date(s.getFullYear(), s.getMonth(), s.getDate());
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (!m) return new Date(s);
    return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  }
  function toISO(d) {
    const date = parseISO(d);
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function dayOfWeek(d) { return parseISO(d).getDay(); }
  function isWeekend(d) { const w = dayOfWeek(d); return w === 0 || w === 6; }
  function nextWeekday(d) {
    let dt = parseISO(d);
    do { dt = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + 1); }
    while (dt.getDay() === 0 || dt.getDay() === 6);
    return dt;
  }
  function weekdaysBetween(from, to) {
    const a = parseISO(from); const b = parseISO(to);
    if (a.getTime() === b.getTime()) return 0;
    const sign = b > a ? 1 : -1;
    let count = 0; let cursor = new Date(a);
    while (sign === 1 ? cursor < b : cursor > b) {
      cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + sign);
      const w = cursor.getDay();
      if (w !== 0 && w !== 6) count += sign;
    }
    return count;
  }
  function dayName(d) { return DAY_NAMES[parseISO(d).getDay()]; }
  function format(d) {
    const date = parseISO(d);
    return date.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  }
  function curriculumDayIndex(d) { const w = dayOfWeek(d); return (w === 0 || w === 6) ? null : w; }
  return { parseISO, toISO, dayOfWeek, isWeekend, nextWeekday, weekdaysBetween, dayName, format, curriculumDayIndex };
})();

/* ---------- lib: random (mulberry32 via FNV seed) ---------- */
window.HSP.makeRng = function (seedString) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < seedString.length; i++) {
    h ^= seedString.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  function next() {
    h |= 0; h = (h + 0x6d2b79f5) | 0;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    next,
    int(maxExclusive) { return Math.floor(next() * maxExclusive); },
    pick(arr) { if (!arr || !arr.length) return null; return arr[Math.floor(next() * arr.length)]; },
    sample(arr, n) {
      if (!arr) return [];
      const copy = arr.slice(); const out = [];
      const take = Math.min(n, copy.length);
      for (let i = 0; i < take; i++) {
        const idx = Math.floor(next() * copy.length);
        out.push(copy.splice(idx, 1)[0]);
      }
      return out;
    }
  };
};

window.HSP.storage = (function () {
  const ROOT = "hsp.v4";
  function load() {
    try {
      const raw = localStorage.getItem(ROOT);
      if (!raw) return defaults();
      const parsed = JSON.parse(raw);
      return Object.assign(defaults(), parsed);
    } catch (e) { console.warn("storage load failed, using defaults", e); return defaults(); }
  }
  function save(state) { localStorage.setItem(ROOT, JSON.stringify(state)); }
  function reset() { localStorage.removeItem(ROOT); localStorage.removeItem("hsp.v3"); localStorage.removeItem("hsp.v2"); localStorage.removeItem("hsp.v1"); }
  function defaults() {
    return {
      version: 4,
      johnny: {
        materialsAvailable: ["construction paper","crayons","playing cards","muffin tin","pom-poms","rice","painter's tape","stickers","pillows","soft balls","stuffed animals"],
        spanishLevel: "moderate",
        messTolerance: "low"
      },
      curriculumStart: { date: "2026-05-04", unit: 6, week: 2, day: 1 },
      planLog: {},          /* { isoDate: { plans: { caregiverId: plan }, usedActivityIds: [], regenSeeds: { cid: n }, feedback: [...], completed } } */
      activityHistory: [],
      favorites: [],
      avoided: [],
      ui: { lastCaregiver: "mama" }
    };
  }
  return { load, save, reset, defaults };
})();

/* ---------- lib: planGenerator ---------- */
window.HSP.planGenerator = (function () {
  const { CURRICULUM, CAREGIVERS, CAREGIVER_MODES, ACTIVITIES, ACTIVITIES_QUERY,
          PATHWAYS, SPANISH, JOHNNY, dateUtils, makeRng } = window.HSP;

  function recentActivityIds(state, limit) {
    const ids = [];
    for (let i = state.activityHistory.length - 1; i >= 0 && ids.length < limit; i--) {
      const e = state.activityHistory[i];
      if (e && e.activityId) ids.push(e.activityId);
    }
    return ids;
  }
  function pickActivity(rng, query, fallbackQuery) {
    const matches = ACTIVITIES_QUERY(query);
    if (matches.length) return rng.pick(matches);
    if (fallbackQuery) {
      const fallback = ACTIVITIES_QUERY(fallbackQuery);
      if (fallback.length) return rng.pick(fallback);
    }
    const any = ACTIVITIES_QUERY({ recentIds: query.recentIds || [], excludeTags: query.excludeTags });
    return rng.pick(any) || ACTIVITIES[0];
  }
  function modeForCaregiver(caregiverId) {
    const cg = CAREGIVERS[caregiverId] || CAREGIVERS.mama;
    return CAREGIVER_MODES[cg.mode];
  }

  function generateDailyPlan(date, caregiverId, state, opts) {
    opts = opts || {};
    const isoDate = dateUtils.toISO(date);
    const target = dateUtils.parseISO(isoDate);
    if (dateUtils.isWeekend(target)) {
      const next = dateUtils.nextWeekday(target);
      return { weekend: true, date: isoDate, dayOfWeek: dateUtils.dayName(target),
        message: "No homeschool today — it's the weekend! Rest up and play freely.",
        nextSchoolDay: dateUtils.toISO(next) };
    }
    const cgDef = CAREGIVERS[caregiverId] || CAREGIVERS.mama;
    const mode  = modeForCaregiver(caregiverId);
    const dayIdx = dateUtils.curriculumDayIndex(isoDate);
    const skillRot = CURRICULUM.dayOfWeekSkills[dayIdx];
    const loc = CURRICULUM.locationForDate(isoDate, dateUtils);
    if (!loc || loc.beyondCurriculum) {
      return { date: isoDate, dayOfWeek: dateUtils.dayName(target),
        message: "You've completed the Playing Preschool year. Time to repeat favorites or explore freely.",
        beyondCurriculum: true };
    }

    const dayLog = state.planLog[isoDate] || {};
    const regenSeed = (dayLog.regenSeeds && dayLog.regenSeeds[caregiverId]) || 0;
    const seedString = isoDate + "|" + caregiverId + "|" + regenSeed;
    const rng = makeRng(seedString);
    const senseFocus = (loc.sub && loc.sub.senseFocus) || null;
    const dayTheme = (loc.sub && loc.sub.theme) || (loc.unit.name + " — " + skillRot.label);
    const focusLetter = (loc.unit.letters && loc.unit.letters[0]) || null;

    /* Tags this unit's play should lean toward — keeps activities on the CURRENT
       unit's theme instead of pulling in a past unit's (e.g. smell from Five Senses). */
    const unitFocus = CURRICULUM.unitFocusTags[loc.unit.n] || [];
    /* smell/taste play belongs only to units that name it (Five Senses, Food).
       Elsewhere it reads as a past unit leaking in — drop it. sight/touch/hearing
       stay allowed because sorting/texture/sound activities carry them incidentally. */
    const SENSE_TAGS = ["smell","taste"];
    const excludeTags = SENSE_TAGS.filter(t => unitFocus.indexOf(t) === -1);

    const recentIds = recentActivityIds(state, 12);
    const avoided = state.avoided || [];
    const usedToday = (dayLog.usedActivityIds || []).slice();
    const messCap = (function () {
      if (state.johnny.messTolerance === "none") return "none";
      if (state.johnny.messTolerance === "low") return "low";
      if (state.johnny.messTolerance === "medium") return "medium";
      return "high";
    })();
    const effectiveMess = mode.allowMessy ? messCap : "low";
    const baseQ = {
      recentIds: recentIds.concat(avoided).concat(usedToday),
      mode: mode.id,
      maxMess: effectiveMess,
      maxPrep: mode.id === "low_prep" ? "none" : (mode.id === "spanish" ? "low" : "medium"),
      excludeTags: excludeTags
    };

    /* Today's focus tags — used to bias every pick toward what the day is about. */
    const focusTags = [];
    if (senseFocus) focusTags.push(senseFocus);
    unitFocus.forEach(t => { if (focusTags.indexOf(t) === -1) focusTags.push(t); });
    if (skillRot.primary && skillRot.primary !== "predicting" && skillRot.primary !== "recall_retell") focusTags.push(skillRot.primary);
    if (skillRot.secondary) focusTags.push(skillRot.secondary);
    /* On predicting/recall days, books are the main vehicle. */
    if (skillRot.primary === "predicting") focusTags.push("predicting", "read_aloud");
    if (skillRot.primary === "recall_retell") focusTags.push("language");

    /* 1) Skill-aligned activity comes FIRST so today's main idea is centered. */
    let skillActivity = null;
    if (skillRot.primary === "alphabet" || skillRot.secondary === "numbers") {
      skillActivity = pickActivity(rng, Object.assign({}, baseQ, { anyTag: [skillRot.primary, skillRot.secondary].filter(Boolean) }));
    } else if (skillRot.primary === "predicting") {
      skillActivity = pickActivity(rng,
        Object.assign({}, baseQ, { anyTag: ["read_aloud","predicting"] }),
        Object.assign({}, baseQ, { kind: "language" }));
    } else if (skillRot.primary === "recall_retell") {
      skillActivity = pickActivity(rng, Object.assign({}, baseQ, { anyTag: ["language","shapes"] }));
    } else if (skillRot.secondary === "sorting") {
      skillActivity = pickActivity(rng, Object.assign({}, baseQ, { anyTag: ["sorting"] }));
    } else if (skillRot.secondary === "measuring") {
      skillActivity = pickActivity(rng, Object.assign({}, baseQ, { anyTag: ["measuring","fine_motor"] }));
    }

    /* Relaxed query (drops `avoided`) — used when a sense-focused pick MUST land. */
    const relaxedQ = {
      recentIds: recentIds.concat(usedToday),
      mode: mode.id,
      maxMess: effectiveMess,
      maxPrep: baseQ.maxPrep,
      excludeTags: excludeTags
    };

    /* 2) Sensory — biased to today's senseFocus. On a sense day this is REQUIRED;
       if strict filters return nothing, fall back through relaxed-avoided, then
       drop the mode constraint, then any sensory. */
    let sensory = null;
    if (mode.id !== "low_prep") {
      sensory = pickActivity(rng,
        Object.assign({}, baseQ, { kind: "sensory", anyTag: senseFocus ? [senseFocus] : (unitFocus.length ? unitFocus : null) }),
        Object.assign({}, baseQ, { kind: "sensory" }));
      if (!sensory && senseFocus) {
        sensory = pickActivity(rng,
          Object.assign({}, relaxedQ, { kind: "sensory", anyTag: [senseFocus] }));
      }
      if (!sensory && senseFocus) {
        /* Last resort for sense days: drop mode constraint so the day still feels themed. */
        sensory = pickActivity(rng, {
          recentIds: recentIds.concat(usedToday),
          maxMess: effectiveMess,
          kind: "sensory",
          anyTag: [senseFocus]
        });
      }
      if (!sensory) {
        sensory = pickActivity(rng, Object.assign({}, baseQ, { kind: "sensory" }));
      }
    }

    /* 3) Movement — try to tie to today's focus where possible. */
    const moveAnyTag = ["movement"];
    if (senseFocus === "hearing") moveAnyTag.unshift("hearing");
    if (skillRot.secondary === "measuring") moveAnyTag.unshift("measuring");
    if (skillRot.secondary === "numbers") moveAnyTag.unshift("numbers");
    const movement = pickActivity(rng,
      Object.assign({}, baseQ, { kind: "movement", anyTag: moveAnyTag }),
      Object.assign({}, baseQ, { kind: "movement" }));

    /* 4) Language — biased to senseFocus + day-skill words. On a sense day this
       is also essential (especially for low_prep mode where there's no sensory
       pick) — so it falls through the same relaxation chain. */
    let language = null;
    if (senseFocus) {
      language = pickActivity(rng,
        Object.assign({}, baseQ, { kind: "language", anyTag: [senseFocus] }));
      if (!language) {
        language = pickActivity(rng,
          Object.assign({}, relaxedQ, { kind: "language", anyTag: [senseFocus] }));
      }
      if (!language) {
        language = pickActivity(rng, {
          recentIds: recentIds.concat(usedToday),
          maxMess: effectiveMess,
          kind: "language",
          anyTag: [senseFocus]
        });
      }
    }
    if (!language) {
      const langAnyTag = [];
      if (skillRot.primary === "predicting") langAnyTag.push("predicting", "read_aloud");
      if (skillRot.primary === "recall_retell") langAnyTag.push("language");
      langAnyTag.push("find_it", "vocabulary");
      language = pickActivity(rng,
        Object.assign({}, baseQ, { kind: "language", anyTag: langAnyTag }),
        Object.assign({}, baseQ, { kind: "language" }));
    }

    let coloring = null;
    if (mode.id === "full" && rng.next() > 0.5) {
      const colorTags = skillRot.primary === "alphabet" ? ["alphabet","coloring"] : null;
      coloring = pickActivity(rng,
        colorTags ? Object.assign({}, baseQ, { anyTag: colorTags }) : Object.assign({}, baseQ, { kind: "coloring" }),
        Object.assign({}, baseQ, { kind: "coloring" }));
    }
    let findItGame = null;
    if (mode.id === "low_prep") {
      findItGame = pickActivity(rng,
        Object.assign({}, baseQ, { anyTag: ["find_it"] }),
        Object.assign({}, baseQ, { kind: "language" }));
    }

    const allChosen = [];
    function add(a) { if (a && allChosen.indexOf(a) === -1) allChosen.push(a); }
    add(skillActivity); add(sensory); add(movement); add(language); add(coloring); add(findItGame);

    const targetTotal = mode.activitiesCount;
    /* Filler also prefers today's focus tags so we don't slip in off-theme activities. */
    const dynamicExclude = recentIds.concat(avoided).concat(usedToday).concat(allChosen.map(a=>a.id));
    while (allChosen.length < targetTotal) {
      let filler = focusTags.length
        ? pickActivity(rng, Object.assign({}, baseQ, { recentIds: dynamicExclude.slice(), anyTag: focusTags }))
        : null;
      if (!filler) filler = pickActivity(rng, Object.assign({}, baseQ, { recentIds: dynamicExclude.slice() }));
      if (!filler || allChosen.indexOf(filler) !== -1) break;
      allChosen.push(filler);
      dynamicExclude.push(filler.id);
    }
    while (allChosen.length > targetTotal) allChosen.pop();

    /* Contextualize titles/steps/materials with today's letter/sense before persisting. */
    const ctx = { focusLetter, senseFocus, primarySkill: skillRot.primary, secondarySkill: skillRot.secondary };
    const adapted = allChosen.map(a => window.HSP.contextualize(a, ctx));

    let readAloud = null;
    if (mode.includeReadAloud) readAloud = readAloudTopic(loc, senseFocus, skillRot, rng);
    const rawBackup = pickActivity(rng, { recentIds: recentIds.concat(avoided).concat(allChosen.map(a=>a.id)), maxPrep: "none", maxMess: "low", anyTag: ["find_it","movement","pretend"], excludeTags: excludeTags });
    const backup = window.HSP.contextualize(rawBackup, ctx);
    const milestone = PATHWAYS.pickForDay(skillRot.primary, senseFocus, rng);
    const spanishWords = mode.spanishExposure === "rich" ? SPANISH.setForDay(loc.unit.name, dayTheme, 7)
      : (mode.spanishExposure === "light" ? SPANISH.setForDay(loc.unit.name, dayTheme, 3) : []);
    const learningGoal = composeLearningGoal(loc, skillRot, senseFocus, mode);
    const matSet = {};
    adapted.forEach(a => (a.materials || []).forEach(m => { matSet[m] = true; }));
    const materialsNeeded = Object.keys(matSet);

    const planId = isoDate + "-" + caregiverId + "-" + regenSeed;
    return {
      planId, date: isoDate, dayOfWeek: dateUtils.dayName(target),
      curriculum: { unitNumber: loc.unit.n, unitName: loc.unit.name,
        unitGuidingQuestion: CURRICULUM.unitGuidingQuestion[loc.unit.n] || null,
        week: loc.week, day: loc.day, focusLetter,
        skillFocus: skillRot.label, primarySkill: skillRot.primary, secondarySkill: skillRot.secondary, senseFocus },
      caregiver: { id: cgDef.id, label: cgDef.label, mode: mode.id, modeLabel: mode.label },
      mainTheme: dayTheme, learningGoal, materialsNeeded, readAloud,
      activities: adapted,
      spanish: spanishWords, lowPrepBackup: backup, milestone,
      adultInvolvement: mode.adultInvolvement,
      tomorrowPreview: previewTomorrow(isoDate).previewText,
      childAgeMonths: JOHNNY.ageMonthsAt(target),
      regenSeed,
      tone: "Warm, simple, low-pressure. Stop when he's done. Repeat what works."
    };
  }

  function readAloudTopic(loc, senseFocus, skillRot, rng) {
    const unit = loc.unit.name;
    let suggestion;
    if (unit === "Five Senses" && senseFocus === "hearing") suggestion = "Pick a picture book about sounds, listening, or animals — something with lots of noise words.";
    else if (unit === "Five Senses" && senseFocus === "smell") suggestion = "Pick a book about food, kitchens, or gardens so you can talk about smells.";
    else if (unit === "Five Senses" && senseFocus === "touch") suggestion = "Pick a touch-and-feel board book or any picture book with textures or animals.";
    else if (unit === "Five Senses" && senseFocus === "sight") suggestion = "Pick a colorful 'look and find' book or a board book with bold pictures.";
    else if (unit === "Five Senses") suggestion = "Pick any of your senses-themed books, or a familiar favorite he'll engage with.";
    else suggestion = "Pick any picture book that fits \"" + unit + "\". A favorite is always fine.";
    const prompts = skillRot.primary === "predicting"
      ? ["Before you start, ask: 'What do you think this book is about?'","Pause on a busy page: 'What do you see? What's happening?'","Ask 'What do you think happens next?' once or twice."]
      : skillRot.primary === "recall_retell"
      ? ["After reading, close the book and ask: 'What did we just read about?'","Point to one favorite page and let him tell you about it.","Try retelling the start, middle, and end together."]
      : ["Hunt for the focus letter on a couple of pages.","Pause and ask 'What is that?' on each page.","Re-read a favorite page if he asks."];
    return { suggestion, prompts: rng.sample(prompts, 2) };
  }
  function composeLearningGoal(loc, skillRot, senseFocus, mode) {
    const senses = {
      hearing: "Notice sounds and put words to what we hear.",
      sight: "Look closely and name what we see.",
      smell: "Notice and name two or three smells.",
      touch: "Feel different textures and use words for them.",
      taste: "Try a flavor and put a word to it (sweet, salty)."
    };
    const skills = {
      sorting: "Try grouping things that are alike.",
      predicting: "Make a guess and then see what happens.",
      measuring: "Compare sizes with words like big, small, more, less.",
      alphabet: "Hear the focus letter sound a few times today.",
      numbers: "Touch and count up to 5 or 10 with help.",
      shapes: "Find a circle or square out in the world.",
      recall_retell: "Tell back something you saw or read."
    };
    const main = senseFocus ? senses[senseFocus] : null;
    const skill = skills[skillRot.primary] || skills[skillRot.secondary] || skills.sorting;
    const pieces = [main, skill].filter(Boolean);
    const closer = mode.id === "low_prep" ? "Keep it light — no pressure, just play."
      : mode.id === "spanish" ? "Mix in Spanish words naturally as you go."
      : "Follow Johnny's lead. Stop when he's done.";
    return pieces.concat(closer).join(" ");
  }
  function previewTomorrow(date) {
    const isoDate = dateUtils.toISO(date);
    let next = dateUtils.parseISO(isoDate);
    do { next = new Date(next.getFullYear(), next.getMonth(), next.getDate() + 1); }
    while (next.getDay() === 0 || next.getDay() === 6);
    const nextIso = dateUtils.toISO(next);
    const loc = CURRICULUM.locationForDate(nextIso, dateUtils);
    const dayIdx = dateUtils.curriculumDayIndex(nextIso);
    const skillRot = CURRICULUM.dayOfWeekSkills[dayIdx];
    if (!loc) return { previewText: "Tomorrow's plan will generate fresh in the morning." };
    const sub = (loc.sub && loc.sub.theme) || (loc.unit.name + " — " + skillRot.label);
    return { previewText: "Tomorrow (" + dateUtils.format(next) + "): " + sub + ". Skill focus — " + skillRot.label + "." };
  }
  function saveFeedback(plan, feedbackArray, state) {
    state.planLog[plan.date] = state.planLog[plan.date] || {};
    state.planLog[plan.date].caregiverId = plan.caregiver.id;
    state.planLog[plan.date].planId = plan.planId;
    state.planLog[plan.date].generatedAt = new Date().toISOString();
    state.planLog[plan.date].feedback = feedbackArray.slice();
    plan.activities.forEach(a => state.activityHistory.push({ date: plan.date, activityId: a.id, kind: a.kind, feedback: feedbackArray.slice() }));
    if (state.activityHistory.length > 200) state.activityHistory = state.activityHistory.slice(-200);
    adjustFromFeedback(state, plan.activities, feedbackArray);
  }
  function adjustFromFeedback(state, activities, feedback) {
    const ids = activities.map(a => a.id);
    const has = f => feedback.indexOf(f) !== -1;
    if (has("loved")) ids.forEach(id => state.favorites.push(id));
    if (has("skipped") || has("too_hard") || has("too_messy") || has("too_boring")) {
      ids.forEach(id => { if (state.avoided.indexOf(id) === -1) state.avoided.push(id); });
    }
    if (state.avoided.length > 30) state.avoided = state.avoided.slice(-30);
  }
  function markDayComplete(plan, state) {
    state.planLog[plan.date] = state.planLog[plan.date] || {};
    state.planLog[plan.date].completed = true;
    state.planLog[plan.date].completedAt = new Date().toISOString();
  }
  return { generateDailyPlan, saveFeedback, previewTomorrow, markDayComplete };
})();

/* ---------- Letter → creature map (used in dynamic activity titles) ---------- */
window.HSP.LETTER_CREATURE = {
  A: "alligator", B: "bear",      C: "cat",       D: "dog",       E: "elephant",
  F: "fish",      G: "goat",      H: "hippo",     I: "inchworm",  J: "jellyfish",
  K: "kangaroo",  L: "lion",      M: "monkey",    N: "newt",      O: "octopus",
  P: "pig",       Q: "quail",     R: "rabbit",    S: "snake",     T: "turtle",
  U: "unicorn",   V: "vulture",   W: "whale",     X: "fox",       Y: "yak",
  Z: "zebra"
};

/* ---------- Contextualize an activity for today's curriculum focus ----------
   Substitutes {LETTER}, {LETTER_LOWER}, {CREATURE} placeholders in titles, steps,
   and materials so an activity tagged "alphabet" reads as "Letter S snake draw"
   on a Letter Ss day, "Letter B bear draw" on a Letter Bb day, etc. */
window.HSP.contextualize = function (activity, c) {
  if (!activity) return activity;
  const out = JSON.parse(JSON.stringify(activity));
  if (!c) return out;
  const fullLetter = c.focusLetter || ""; /* e.g. "Ss", "Cc", "Aa" */
  const upper = fullLetter.charAt(0) || "";
  const lower = (fullLetter.length > 1 ? fullLetter.charAt(1) : (upper ? upper.toLowerCase() : "")) || "";
  const creature = window.HSP.LETTER_CREATURE[upper] || "creature";
  function sub(s) {
    if (typeof s !== "string") return s;
    return s
      .replace(/\{LETTER_LOWER\}/g, lower)
      .replace(/\{LETTER_FULL\}/g, fullLetter)
      .replace(/\{CREATURE\}/g, creature)
      .replace(/\{LETTER\}/g, upper);
  }
  if (out.title) out.title = sub(out.title);
  if (Array.isArray(out.steps)) out.steps = out.steps.map(sub);
  if (Array.isArray(out.materials)) out.materials = out.materials.map(sub);
  if (out.safety) out.safety = sub(out.safety);
  return out;
};

/* ---------- Skill / letter labeling for activities ---------- */
window.HSP.activityLabel = function (activity, c) {
  /* c = plan.curriculum */
  const tags = activity.tags || [];
  /* Most specific: alphabet on letter days */
  if (tags.indexOf("alphabet") !== -1 && c.focusLetter) {
    return { text: "Letter " + c.focusLetter, color: "purple" };
  }
  /* Match the day's primary skill */
  const SKILL_LABELS = {
    sorting:       { text: "Sorting",          color: "yellow" },
    predicting:    { text: "Predicting",       color: "pink"   },
    measuring:     { text: "Measuring",        color: "blue"   },
    numbers:       { text: "Numbers 1–10",     color: "green"  },
    shapes:        { text: "Shapes",           color: "blue"   },
    recall_retell: { text: "Recall & retell",  color: "pink"   }
  };
  if (tags.indexOf(c.primarySkill) !== -1 && SKILL_LABELS[c.primarySkill]) return SKILL_LABELS[c.primarySkill];
  if (tags.indexOf(c.secondarySkill) !== -1 && SKILL_LABELS[c.secondarySkill]) return SKILL_LABELS[c.secondarySkill];
  /* Sense focus */
  if (c.senseFocus && tags.indexOf(c.senseFocus) !== -1) {
    return { text: c.senseFocus.charAt(0).toUpperCase() + c.senseFocus.slice(1), color: "orange" };
  }
  /* Tag-based fallbacks */
  if (tags.indexOf("hearing") !== -1)    return { text: "Hearing",      color: "teal"   };
  if (tags.indexOf("touch") !== -1)      return { text: "Touch",        color: "orange" };
  if (tags.indexOf("smell") !== -1)      return { text: "Smell",        color: "orange" };
  if (tags.indexOf("taste") !== -1)      return { text: "Taste",        color: "red"    };
  if (tags.indexOf("sight") !== -1)      return { text: "Sight",        color: "blue"   };
  if (tags.indexOf("numbers") !== -1)    return { text: "Numbers 1–10", color: "green"  };
  if (tags.indexOf("shapes") !== -1)     return { text: "Shapes",       color: "blue"   };
  if (tags.indexOf("sorting") !== -1)    return { text: "Sorting",      color: "yellow" };
  if (tags.indexOf("predicting") !== -1) return { text: "Predicting",   color: "pink"   };
  if (tags.indexOf("movement") !== -1)   return { text: "Movement",     color: "red"    };
  if (tags.indexOf("sensory") !== -1)    return { text: "Sensory play", color: "orange" };
  if (tags.indexOf("language") !== -1)   return { text: "Language",     color: "green"  };
  if (tags.indexOf("fine_motor") !== -1) return { text: "Fine motor",   color: "purple" };
  if (tags.indexOf("find_it") !== -1)    return { text: "Find-it",      color: "teal"   };
  if (tags.indexOf("pretend") !== -1)    return { text: "Pretend play", color: "pink"   };
  return { text: "Play", color: "purple" };
};

/* ---------- app: UI controller ---------- */
(function () {
  const HSP = window.HSP;
  const { CAREGIVERS, CURRICULUM, JOHNNY, dateUtils, planGenerator, storage } = HSP;
  let state = storage.load();
  let view = "dashboard";
  let currentPlan = null;

  function $(sel, root) { return (root || document).querySelector(sel); }
  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (k === "class") e.className = attrs[k];
        else if (k === "html") e.innerHTML = attrs[k];
        else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
        else e.setAttribute(k, attrs[k]);
      }
    }
    (children || []).forEach(c => {
      if (c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }
  function persist() { storage.save(state); }

  function render() {
    const root = $("#app");
    root.innerHTML = "";
    root.appendChild(renderHeader());
    if (view === "dashboard") root.appendChild(renderDashboard());
    else if (view === "settings") root.appendChild(renderSettings());
    else if (view === "history")  root.appendChild(renderHistory());
    root.appendChild(renderFooter());
  }

  function renderHeader() {

      el("button", { class: view === "settings" ? "active" : "",  onclick: () => { view = "settings"; render(); } }, ["Settings"])
    ]));
    return wrap;
  }
  function renderFooter() {

    f.appendChild(el("span", { html: HSP.dinoStripSvg() }));

    const select = el("select", { id: "caregiverSel", onchange: e => { state.ui.lastCaregiver = e.target.value; persist(); }});
    Object.keys(CAREGIVERS).forEach(id => {
      const opt = el("option", { value: id }, [CAREGIVERS[id].label]);

    gen.appendChild(el("div", { class: "row" }, [
      el("label", { class: "field" }, ["Caregiver", select]),

    const out = el("div", { id: "planOut" });
    wrap.appendChild(out);
    if (currentPlan) renderPlanInto(out, currentPlan);
    return wrap;
  }

  function generate(regenerate) {
    const cgId = $("#caregiverSel").value;
    const dt = $("#dateSel").value;
    state.ui.lastCaregiver = cgId; persist();

    const isoDate = dateUtils.toISO(dt);
    state.planLog[isoDate] = state.planLog[isoDate] || {};
    const dayLog = state.planLog[isoDate];
    dayLog.plans = dayLog.plans || {};
    dayLog.regenSeeds = dayLog.regenSeeds || {};
    dayLog.usedActivityIds = dayLog.usedActivityIds || [];

    if (regenerate) {
      /* Free up this caregiver's prior picks (incl. backup) for today, bump seed, drop cache. */
      if (dayLog.plans[cgId]) {
        const old = dayLog.plans[cgId];
        const oldIds = old.activities.map(a => a.id);
        if (old.lowPrepBackup) oldIds.push(old.lowPrepBackup.id);
        dayLog.usedActivityIds = dayLog.usedActivityIds.filter(id => oldIds.indexOf(id) === -1);
        delete dayLog.plans[cgId];
      }
      dayLog.regenSeeds[cgId] = (dayLog.regenSeeds[cgId] || 0) + 1;
    }

    if (dayLog.plans[cgId]) {
      currentPlan = dayLog.plans[cgId];
    } else {
      currentPlan = planGenerator.generateDailyPlan(dt, cgId, state, { regenerate });
      if (currentPlan && !currentPlan.weekend && !currentPlan.beyondCurriculum) {
        dayLog.plans[cgId] = currentPlan;
        dayLog.caregiverId = cgId;
        dayLog.planId = currentPlan.planId;
        currentPlan.activities.forEach(a => {
          if (dayLog.usedActivityIds.indexOf(a.id) === -1) dayLog.usedActivityIds.push(a.id);
        });
        if (currentPlan.lowPrepBackup && dayLog.usedActivityIds.indexOf(currentPlan.lowPrepBackup.id) === -1) {
          dayLog.usedActivityIds.push(currentPlan.lowPrepBackup.id);

    /* ----- flat activities list ----- */
    card.appendChild(el("h3", null, ["✏️ Today's activities"]));
    const list = el("div", { class: "activities-list" });

      ]));

    /* feedback */

    const FB_LABEL = { completed:"✓ Completed", loved:"♥ Loved it", skipped:"Skipped",

    const existing = (state.planLog[plan.date] && state.planLog[plan.date].feedback) || [];

  function metaCell(label, value) {
    return el("div", null, [el("div", { class: "meta-label" }, [label]), el("div", { class: "meta-value" }, [value])]);
  }

  /* ----- single activity card with skill/letter focus pill ----- */
  const COLOR_CYCLE = ["red","orange","yellow","green","blue","purple","pink","teal"];

  };
  function renderActivity(a, num, c) {

    wrap.appendChild(cur);

    const mat = el("section", { class: "panel" }, [el("h2", null, ["🧺 Materials available at home"])]);
    const matInput = el("input", { type: "text", id: "matInput", placeholder: "add a material and press Enter", style: "width:100%;" });
    matInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const v = matInput.value.trim();
        if (v) { state.johnny.materialsAvailable.push(v); matInput.value = ""; persist(); render(); }
      }
    });
    mat.appendChild(matInput);
    const matList = el("div", { class: "materials-list", style: "margin-top:12px;" });
    state.johnny.materialsAvailable.forEach((m, idx) => {
      matList.appendChild(el("span", { class: "pill", title: "Click to remove",
        onclick: () => { state.johnny.materialsAvailable.splice(idx, 1); persist(); render(); }
      }, [m, " ✕"]));
    });
    mat.appendChild(matList);
    wrap.appendChild(mat);

    const mess = el("section", { class: "panel" }, [el("h2", null, ["🎨 Mess tolerance"])]);
    const messSel = el("select", { onchange: e => { state.johnny.messTolerance = e.target.value; persist(); } });
    ["none","low","medium","high"].forEach(v => {
      const opt = el("option", { value: v }, [v]);
      if (state.johnny.messTolerance === v) opt.setAttribute("selected", "");
      messSel.appendChild(opt);
    });
    mess.appendChild(messSel);
    wrap.appendChild(mess);

    const sp = el("section", { class: "panel" }, [el("h2", null, ["🌎 Spanish exposure"])]);
    const spSel = el("select", { onchange: e => { state.johnny.spanishLevel = e.target.value; persist(); } });
    ["minimal","moderate","rich"].forEach(v => {
      const opt = el("option", { value: v }, [v]);
      if (state.johnny.spanishLevel === v) opt.setAttribute("selected", "");
      spSel.appendChild(opt);
    });
    sp.appendChild(spSel);
    sp.appendChild(el("p", { style: "font-size:12px;color:var(--muted);margin-top:8px;font-weight:600;" }, ["Nana / Papa days always include rich Spanish exposure regardless of this setting."]));
    wrap.appendChild(sp);

    const av = el("section", { class: "panel" }, [
      el("h2", null, ["♥ Favorites & avoided"]),
      el("h3", null, ["Favorites (" + state.favorites.length + ")"]),
      el("p", { style: "font-size:13px;color:var(--muted);font-weight:600;" }, [state.favorites.join(", ") || "None yet — mark activities as Loved to add."]),
      el("h3", null, ["Avoided (" + state.avoided.length + ")"]),
      el("p", { style: "font-size:13px;color:var(--muted);font-weight:600;" }, [state.avoided.join(", ") || "None yet — Skipped / Too Hard / Too Messy / Too Boring add to this list."]),
      el("button", { class: "ghost", style: "margin-top:14px;",
        onclick: () => { if (confirm("Reset all saved data (history, feedback, settings)?")) { storage.reset(); state = storage.load(); render(); } }
      }, ["Reset all data"])
    ]);
    wrap.appendChild(av);
    return wrap;
  }
  function infoLine(k, v) {
    return el("div", { class: "row", style: "justify-content:space-between;border-top:1px solid var(--line);padding:10px 0;" }, [
      el("div", { style: "font-family:'Fredoka',sans-serif;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:500;" }, [k]),
      el("div", { style: "font-size:14px;font-weight:700;" }, [v])
    ]);
  }

  function renderHistory() {
    const wrap = el("section", { class: "panel" }, [el("h2", null, ["📚 History"])]);
    const dates = Object.keys(state.planLog).sort().reverse();
    if (!dates.length) {
      wrap.appendChild(el("p", { style: "color:var(--muted);font-size:14px;font-weight:600;" }, ["No plans generated yet. Head to Today and click Generate."]));
      return wrap;
    }
    dates.forEach(d => {
      const entry = state.planLog[d];
      const fb = (entry.feedback || []).map(f => f.replace(/_/g, " ")).join(", ");
      const cgs = entry.plans ? Object.keys(entry.plans).map(id => (CAREGIVERS[id] || {}).label || id).join(", ") : ((CAREGIVERS[entry.caregiverId] || {}).label || entry.caregiverId || "—");
      wrap.appendChild(el("div", { class: "history-row" }, [
        el("div", { class: "h-date" }, [dateUtils.format(d)]),
        el("div", null, [cgs, entry.completed ? " · ✓ completed" : ""]),
        el("div", { class: "h-fb" }, [fb || "—"])
      ]));
    });
    return wrap;
  }

  document.addEventListener("DOMContentLoaded", render);
})();
</script>
</body>
</html>
